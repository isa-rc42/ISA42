    foreground: "#ffffff"
    logo: "images/logos/rc42.png"
    left:
      - text: "Home"
        href: index.qmd
      - text: "About"
        href: about/index.qmd
        menu:
          - text: "About RC42"
            href: about/index.qmd
          - text: "Objectives"
            href: about/index.qmd#objectives
          - text: "History"
            href: about/index.qmd#history
          - text: "Statutes"
