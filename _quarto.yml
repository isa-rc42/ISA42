project:
  type: website
  output-dir: docs
  resources:
    - "data/rc42_members_clean.json"
    - "data/community_submissions.json"
    - "data/members.json"
    - "data/members_diagnostics.json"
    - "data/past_members.json"
    - "data/resources.json"
    - "data/resources_diagnostics.json"
